<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Un mensaje para ti 🌸</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#ff7eb3,#ffb6d9,#ffd6eb);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
}

.caja{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
max-width:420px;
}

h2{
color:#ff3d8e;
}

#mensaje{
margin-top:20px;
font-size:18px;
line-height:1.5;
}

.flor{
position:absolute;
top:-50px;
font-size:22px;
animation:caer linear infinite;
opacity:0.8;
}

@keyframes caer{
0%{transform:translateY(0)}
100%{transform:translateY(110vh)}
}

</style>
</head>

<body>

<div class="caja">

<h2>🌸 Un mensaje para ti</h2>

<p id="fecha"></p>

<div id="mensaje"></div>

</div>

<script>

// fecha actual
const hoy = new Date()

const dia = hoy.getDate()
const mes = hoy.getMonth() + 1
const año = hoy.getFullYear()

// calcular día del año correctamente
const inicioAño = new Date(año, 0, 0)
const diff = hoy - inicioAño
const unDia = 1000 * 60 * 60 * 24
const diaDelAño = Math.floor(diff / unDia)

// mostrar fecha bonita
document.getElementById("fecha").innerText =
hoy.toLocaleDateString("es-CO",{weekday:"long",year:"numeric",month:"long",day:"numeric"})

// mensajes especiales
let mensaje = ""

if(mes===3 && dia===8){
mensaje="🌸 Hoy es el Día Internacional de la Mujer. Solo quería recordarte que eres una mujer increíble y que tu forma de ser inspira más de lo que imaginas."
}

else if(mes===2 && dia===14){
mensaje="💌 Hoy es un día donde muchos hablan de amor, pero yo solo quería decir que tu forma de ser tiene algo muy especial."
}

else if(mes===11 && dia===25){
mensaje="🌸 Hoy se recuerda la importancia de respetar y valorar a cada mujer. Y tú eres alguien que merece admiración."
}

// mensajes diarios (se generan según el día)
if(mensaje===""){

const cualidades=[
"tu sonrisa",
"tu forma de pensar",
"tu energía",
"tu manera de ver la vida",
"tu autenticidad",
"tu inteligencia",
"tu alegría",
"tu forma de tratar a las personas",
"tu sensibilidad",
"tu fortaleza"
]

const frases=[
"hace el día mejor",
"inspira a las personas",
"deja huella en quienes te conocen",
"ilumina cualquier lugar",
"es difícil de encontrar en otras personas",
"vale mucho más de lo que imaginas",
"es una de tus mejores cualidades",
"puede cambiar el día de alguien"
]

const cualidad = cualidades[diaDelAño % cualidades.length]
const frase = frases[diaDelAño % frases.length]

mensaje = "🌸 Mensaje del día " + diaDelAño + "<br><br>Hoy solo quería recordarte que " + cualidad + " " + frase + "."
}

// mostrar mensaje
document.getElementById("mensaje").innerHTML = mensaje

// flores cayendo
function crearFlores(){

for(let i=0;i<25;i++){

let flor = document.createElement("div")

flor.className="flor"

flor.innerHTML="🌸"

flor.style.left = Math.random()*100 + "vw"

flor.style.animationDuration = (Math.random()*5+5)+"s"

document.body.appendChild(flor)

}

}

crearFlores()

</script>

</body>
</html>
