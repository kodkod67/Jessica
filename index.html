<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Un mensaje para ti</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ff7eb3,#ffb6d9,#ffd6eb);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
}

.caja{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
max-width:420px;
animation:entrada 1s ease;
}

h2{
color:#ff3d8e;
}

#mensaje{
font-size:18px;
line-height:1.5;
margin-top:20px;
}

.flor{
position:absolute;
top:-50px;
font-size:22px;
animation:caer linear infinite;
opacity:0.8;
}

@keyframes caer{
0%{transform:translateY(0)}
100%{transform:translateY(110vh)}
}

@keyframes entrada{
from{opacity:0;transform:scale(.8)}
to{opacity:1;transform:scale(1)}
}

</style>

</head>

<body>

<div class="caja">

<h2>🌸 Un pequeño mensaje para ti</h2>

<p id="fecha"></p>

<div id="mensaje"></div>

</div>

<script>

// obtener fecha
let hoy = new Date()

let dia = hoy.getDate()
let mes = hoy.getMonth()+1

// calcular día del año
let inicio = new Date(hoy.getFullYear(),0,0)
let diff = hoy - inicio
let diaDelAño = Math.floor(diff / (1000*60*60*24))

// mensajes especiales
let mensajeEspecial = ""

if(mes==3 && dia==8){
mensajeEspecial="Hoy es el Día Internacional de la Mujer 🌸. Solo quería recordarte que eres una mujer increíble, fuerte y que inspiras más de lo que imaginas."
}

else if(mes==2 && dia==14){
mensajeEspecial="En un día donde se celebra el amor, solo paso a decirte que tu forma de ser tiene algo muy bonito."
}

else if(mes==11 && dia==25){
mensajeEspecial="Hoy se recuerda la importancia de respetar y valorar a cada mujer. Y tú eres alguien que merece todo el respeto y admiración."
}

// mensajes generales (365 variaciones)
let cualidades=[
"tu sonrisa",
"tu forma de pensar",
"tu energía",
"tu manera de ver la vida",
"tu autenticidad",
"tu forma de tratar a las personas",
"tu inteligencia",
"tu sensibilidad",
"tu alegría",
"tu fortaleza"
]

let frases=[
"tiene algo especial",
"hace el día mejor",
"inspira a las personas",
"deja huella en quienes te conocen",
"ilumina cualquier lugar",
"es difícil de encontrar en otras personas",
"vale mucho más de lo que imaginas",
"es una de tus mejores cualidades"
]

let cualidad=cualidades[diaDelAño % cualidades.length]
let frase=frases[diaDelAño % frases.length]

let mensajeDiario = "Mensaje del día " + diaDelAño + " 🌸<br><br>" +
"Hoy solo quería recordarte que " + cualidad + " " + frase + "."

// mostrar mensaje
document.getElementById("mensaje").innerHTML = mensajeEspecial || mensajeDiario

document.getElementById("fecha").innerHTML = hoy.toLocaleDateString("es-CO",{
weekday:'long',
year:'numeric',
month:'long',
day:'numeric'
})

// flores animadas
function flores(){
for(let i=0;i<30;i++){

let flor=document.createElement("div")

flor.className="flor"

flor.innerHTML="🌸"

flor.style.left=Math.random()*100+"vw"

flor.style.animationDuration=(Math.random()*5+4)+"s"

document.body.appendChild(flor)

}
}

flores()

</script>

</body>
</html>
